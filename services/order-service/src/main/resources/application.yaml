server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orders}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:local-dev-only}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
aws:
  region: ${AWS_REGION:us-west-2}
  endpoint: ${AWS_ENDPOINT_URL:}
queues:
  request-name: ${ORDER_REQUEST_QUEUE:order-requests}
  result-name: ${ORDER_RESULT_QUEUE:order-results}
management.endpoints.web.exposure.include: health,info
