server:
  port: ${SERVER_PORT:8081}
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:orderflow}
    password: ${RABBITMQ_PASSWORD:local-dev-only}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/inventory}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:local-dev-only}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
messaging:
  exchange: orderflow.exchange
  request-queue: order-requests
  result-queue: order-results
  request-routing-key: order.requested
  result-routing-key: order.result
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
